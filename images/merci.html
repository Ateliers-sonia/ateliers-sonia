<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci pour votre commande — Ateliers Sonia</title>
<link rel="icon" type="image/png" href="images/logo.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --linen: #1A1522;
    --walnut: #F3ECDD;
    --walnut-soft: #B7AB94;
    --ochre: #E0A458;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    background: var(--linen);
    color: var(--walnut);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 24px;
  }
  .box{ max-width: 480px; }
  img{ width: 100px; margin-bottom: 24px; }
  h1{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 2rem;
    margin-bottom: 16px;
    color: var(--ochre);
  }
  p{ color: var(--walnut-soft); line-height: 1.6; margin-bottom: 24px; }
  a{
    display:inline-block;
    padding: 12px 26px;
    background: var(--ochre);
    color: var(--linen);
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="box">
    <img src="images/logo.png" alt="Ateliers Sonia">
    <h1>Merci pour votre commande !</h1>
    <p>Votre paiement a bien été reçu. Sonia prépare votre tableau avec soin et vous recevrez un email de confirmation avec le suivi de l'expédition très prochainement.</p>
    <a href="index.html">Retour au site</a>
  </div>
</body>
</html>
